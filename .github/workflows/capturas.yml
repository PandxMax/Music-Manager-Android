name: Capturas de pantalla
on: workflow_dispatch
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Generar capturas
        run: gradle testDebugUnitTest --tests '*Capturas*' -Proborazzi.test.record=true --no-daemon --stacktrace
      - name: Informe si falla
        if: failure()
        run: |
          mkdir -p app/build/capturas
          find app/build/test-results -name '*.xml' -exec cat {} + | grep -B2 -A30 '<failure' | head -150 > app/build/capturas/errores.txt || true
          find app/build/reports -name '*.html' | head -3 >> app/build/capturas/errores.txt || true
      - name: Subir capturas a la rama «capturas»
        if: always()
        run: |
          cd app/build/capturas
          git init -q -b capturas
          git config user.name PandxMax
          git config user.email 149822534+PandxMax@users.noreply.github.com
          git add -A
          git commit -qm "Capturas de pantalla"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas
