name: Crear APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk MusicManager-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicManager-Android
          path: MusicManager-Android.apk
      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" MusicManager-Android.apk --latest --title "Music Manager Android $V" --notes "APK para Android versión $V. Descárgalo e instálalo (permite instalar apps de origen desconocido)."
