name: Crear APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicManager-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicManager-Android
          path: MusicManager-Android.apk
      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" MusicManager-Android.apk --latest --title "Music Manager Android $V" --notes "APK para Android versión $V. Descárgalo e instálalo (permite instalar apps de origen desconocido)."
